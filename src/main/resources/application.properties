spring.application.name=flexmeet-video-conference

# Server Configuration
server.port=8080
server.servlet.context-path=/api

# Database Configuration
spring.h2.console.enabled=true
spring.datasource.url=jdbc:h2:mem:flexmeetdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Logging Configuration
logging.level.root=INFO
logging.level.com.flexmeet=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %logger{36} - %msg%n

# JWT Configuration
jwt.secret=${JWT_SECRET:dev-only-change-this-signing-secret-before-deploying-flexmeet}
jwt.expiration=86400000

# Firebase Admin credentials and database are supplied by deployment environment.
firebase.service-account-path=${FIREBASE_SERVICE_ACCOUNT_PATH:serviceAccountKey.json}
firebase.database.url=${FIREBASE_DATABASE_URL:}

# WebSocket Configuration
spring.websocket.max-connections=1000

# CORS Configuration
app.cors.allowed-origins=${FLEXMEET_WEB_ORIGIN:https://flexmeet-aiman-3859.vercel.app}

# LiveKit SFU. Supply these values as deployment environment variables.
livekit.url=${LIVEKIT_URL:}
livekit.api-key=${LIVEKIT_API_KEY:}
livekit.api-secret=${LIVEKIT_API_SECRET:}
flexmeet.web-origin=${FLEXMEET_WEB_ORIGIN:https://flexmeet-aiman-3859.vercel.app}
