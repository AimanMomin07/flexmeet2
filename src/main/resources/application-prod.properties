spring.application.name=flexmeet-video-conference

# Server Configuration
server.port=8080
server.servlet.context-path=/api

# Database Configuration (Production - PostgreSQL)
spring.datasource.url=jdbc:postgresql://postgres:5432/flexmeet
spring.datasource.username=flexmeet
spring.datasource.password=${DB_PASSWORD:changeme}
spring.datasource.driverClassName=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Logging Configuration
logging.level.root=WARN
logging.level.com.flexmeet=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %logger{36} - %msg%n
logging.file.name=/app/logs/flexmeet.log

# JWT Configuration
jwt.secret=${JWT_SECRET:your-secret-key-change-this-in-production-at-least-32-characters}
jwt.expiration=86400000

# Firebase Configuration
firebase.database.url=${FIREBASE_DATABASE_URL:https://your-project.firebaseio.com}

# WebSocket Configuration
spring.websocket.max-connections=1000

# CORS Configuration (Production)
app.cors.allowed-origins=https://your-domain.com,https://www.your-domain.com

# SSL Configuration (Optional)
server.ssl.enabled=false
server.ssl.key-store=${SSL_KEYSTORE_PATH:}
server.ssl.key-store-password=${SSL_KEYSTORE_PASSWORD:}
server.ssl.key-store-type=PKCS12

# Performance
spring.jpa.properties.hibernate.jdbc.batch_size=10
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
server.tomcat.threads.max=200
server.tomcat.threads.min-spare=10

# Connection Pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000
